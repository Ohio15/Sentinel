global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sentinel-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['sentinel-backend:8080']
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['sentinel-postgres:5432']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['sentinel-redis:6379']
    scrape_interval: 15s
