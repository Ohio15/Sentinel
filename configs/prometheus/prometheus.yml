global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'sentinel-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['sentinel-backend:8080']
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Synthetic end-to-end probe of the PUBLIC URL via blackbox-exporter.
  # Exercises Cloudflare -> Traefik -> backend, catching edge/routing failures
  # that the internal 'sentinel-backend' scrape (same Docker network) misses.
  - job_name: 'blackbox-public'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sentinelrmm.us/health
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
