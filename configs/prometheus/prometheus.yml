global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'sentinel-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['sentinel-backend:8080']
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Synthetic end-to-end probe of the PUBLIC URL via blackbox-exporter.
  # Exercises Cloudflare -> Traefik -> backend, catching edge/routing failures
  # that the internal 'sentinel-backend' scrape (same Docker network) misses.
  - job_name: 'blackbox-public'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sentinelrmm.us/health
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Synthetic probe of INTERNAL .nexus routes (Traefik Docker-provider routes).
  # These resolve only via NEXUS AdGuard, so blackbox can't use public DNS;
  # extra_hosts (docker-compose.override.yml) maps each name to the host IP so
  # SNI/Host stay the real .nexus name and Traefik routes by Host. The
  # http_2xx_internal module accepts the self-signed *.nexus cert.
  # Catches the 2026-06-05 failure mode: Docker-provider routes silently 404 for
  # weeks while file-provider routes (probed publicly) stayed green.
  - job_name: 'blackbox-internal'
    metrics_path: /probe
    params:
      module: [http_2xx_internal]
    static_configs:
      - targets:
          - https://updates.nexus/manifest.json
          - https://grafana.nexus/api/health
          - https://openclaw.nexus/
          - https://toolvault.nexus/
          - https://sentinel.nexus/
        labels:
          scope: internal
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # APM (apm.nexus) — dedicated job so APM has its own 5m ApmDown alert
  # (rules/apm.yml) instead of sharing PublicEndpointDown. Two probes:
  #  - /api/health through Traefik, body must contain "status":"ok"
  #    (module http_apm_health). /api/health is reachable from blackbox's
  #    source IP despite APM single-user mode's client-IP trust.
  #  - / (the frontend SPA), plain 200 (moved here from blackbox-internal so
  #    one outage does not page twice).
  # The per-target __param_module label selects the blackbox module.
  - job_name: 'blackbox-apm'
    metrics_path: /probe
    static_configs:
      - targets:
          - https://apm.nexus/api/health
        labels:
          __param_module: http_apm_health
          service: apm
          scope: internal
      - targets:
          - https://apm.nexus/
        labels:
          __param_module: http_2xx_internal
          service: apm
          scope: internal
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # External witness for the Patriot Companies WAN circuit (AT&T).
  # ICMP-probes the site's public IP from NEXUS, so a site-wide outage is
  # observed from a vantage OUTSIDE the site's own hardware chain
  # (AT&T gateway -> USG -> LAN). Motivated by the 2026-07-29 outage
  # (shared-brain incident 858e8538): with no external witness, the fault
  # could not be localized to ISP-vs-USG-vs-power without on-site eyes.
  # Since the 2026-09-01 BGW320 IP-passthrough change the public IP lives on
  # the USG, whose WAN_LOCAL policy drops ICMP echo — the ICMP leg alone read
  # 0 permanently and the alert fired nonstop. The TCP leg handshakes the
  # recorder port-forward (:80, re-enabled 2026-09-22, shared-brain c11d82ef).
  # Each target carries its own module; PatriotWANDown fires only when EVERY
  # leg fails. Egress IP last confirmed on site 2026-09-08 (c6179498).
  - job_name: 'blackbox-wan-patriot'
    metrics_path: /probe
    static_configs:
      - targets:
          - 104.189.209.197  # Patriot site WAN IP (AT&T) — ICMP
        labels:
          module: icmp
      - targets:
          - 104.189.209.197:80  # same IP — TCP handshake to recorder forward
        labels:
          module: tcp_connect
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
