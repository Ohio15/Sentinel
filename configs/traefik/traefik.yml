# Traefik Static Configuration
# Production-ready configuration for Sentinel RMM

api:
  dashboard: false
  insecure: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  filePath: /var/log/traefik/access.log
  bufferingSize: 100

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 300s
    http:
      tls:
        certResolver: letsencrypt
      # NOTE: Middlewares moved to individual routers to avoid interfering with WebSocket upgrades
      # WebSocket connections fail when entrypoint-level middlewares modify upgrade headers

  # Alternate HTTPS port (bypasses router cache issues on 443)
  websecure-alt:
    address: ":4443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 300s
    http:
      tls:
        certResolver: letsencrypt

  # Dedicated entrypoint for agent mTLS connections
  agents:
    address: ":8443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 300s
    http:
      tls:
        options: mtls@file

  # gRPC Data Plane for high-throughput agent data streams
  # TLS passthrough - backend handles TLS termination
  grpc:
    address: ":4444"

providers:
  # Docker provider disabled - doesn't work on Windows
  # Using file-based routing instead
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
