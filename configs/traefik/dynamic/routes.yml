# Traefik Dynamic Configuration - Routes
http:
  routers:
    # API routes
    api:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 2

    # WebSocket routes
    ws:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/ws`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 2

    # Frontend routes
    frontend:
      rule: "Host(`sentinelrmm.us`)"
      entryPoints:
        - websecure
      service: frontend
      tls:
        certResolver: letsencrypt
      priority: 1

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://sentinel-backend:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://sentinel-frontend:80"
