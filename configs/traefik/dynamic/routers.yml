# Traefik Dynamic Configuration - Routers and Services
# File-based routing for Sentinel RMM (Windows-compatible)

http:
  routers:
    # =========================================================================
    # HTTPS Routes (port 443) - Production domain
    # =========================================================================

    # API routes
    api:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
        - rateLimit
      priority: 10

    # WebSocket routes for dashboard
    ws-dashboard:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 10

    # Health check routes
    health:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/health`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 5

    # Frontend (catch-all for web UI)
    frontend:
      rule: "Host(`sentinelrmm.us`)"
      entryPoints:
        - websecure
      service: frontend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # HTTPS Routes (port 443) - Localhost
    # =========================================================================

    api-local:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      middlewares:
        - securityHeaders
        - rateLimit
      priority: 10

    ws-dashboard-local:
      rule: "Host(`localhost`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      priority: 10

    frontend-local:
      rule: "Host(`localhost`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # Alternate HTTPS Routes (port 4443) - Bypasses router cache
    # =========================================================================

    api-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
        - rateLimit
      priority: 10

    ws-dashboard-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 10

    frontend-alt:
      rule: "Host(`sentinelrmm.us`)"
      entryPoints:
        - websecure-alt
      service: frontend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # mTLS Routes (port 8443) - Agent connections
    # =========================================================================

    ws-agent:
      rule: "PathPrefix(`/ws/agent`) || PathPrefix(`/ws`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      middlewares:
        - agentRateLimit
      priority: 10

    agent-api:
      rule: "PathPrefix(`/api/agent`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      middlewares:
        - agentRateLimit
      priority: 10

    agent-health:
      rule: "PathPrefix(`/health`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      priority: 5

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://sentinel-backend:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://sentinel-frontend:80"
