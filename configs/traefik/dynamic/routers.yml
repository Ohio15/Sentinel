# Traefik Dynamic Configuration - Routers and Services
# File-based routing for Sentinel RMM (Windows-compatible)

http:
  routers:
    # =========================================================================
    # HTTPS Routes (port 443) - Production domain
    # =========================================================================

    # API routes
    api:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
        - rateLimit
      priority: 10

    # WebSocket routes for agents (port 443 fallback for older agents)
    ws-agent-443:
      rule: "Host(`sentinelrmm.us`) && (PathPrefix(`/ws/agent`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 12

    # WebSocket routes for dashboard
    ws-dashboard:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 10

    # Health check routes
    health:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/health`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 5

    # Frontend (catch-all for web UI)
    frontend:
      rule: "Host(`sentinelrmm.us`)"
      entryPoints:
        - websecure
      service: frontend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # HTTPS Routes (port 443) - Localhost
    # =========================================================================

    api-local:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      middlewares:
        - securityHeaders
        - rateLimit
      priority: 10

    ws-agent-local:
      rule: "Host(`localhost`) && (PathPrefix(`/ws/agent`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      priority: 12

    ws-dashboard-local:
      rule: "Host(`localhost`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      priority: 10

    frontend-local:
      rule: "Host(`localhost`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # Alternate HTTPS Routes (port 4443) - Bypasses router cache
    # =========================================================================

    # Agent WebSocket route for port 4443
    ws-agent-alt:
      rule: "Host(`sentinelrmm.us`) && (PathPrefix(`/ws/agent`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 15

    # Agent API route for port 4443
    api-agent-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api/agent`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 12

    api-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
      priority: 10

    ws-dashboard-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/ws/dashboard`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 10

    # Health check route for port 4443
    health-alt:
      rule: "Host(`sentinelrmm.us`) && PathPrefix(`/health`)"
      entryPoints:
        - websecure-alt
      service: backend
      tls:
        certResolver: letsencrypt
      priority: 5

    frontend-alt:
      rule: "Host(`sentinelrmm.us`)"
      entryPoints:
        - websecure-alt
      service: frontend
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
      priority: 1

    # =========================================================================
    # mTLS Routes (port 8443) - Agent connections with client certificates
    # =========================================================================

    # mTLS-authenticated WebSocket endpoint (certificate auth, no token)
    ws-agent-mtls:
      rule: "PathPrefix(`/ws/agent/mtls`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      middlewares:
        - agentRateLimit
      priority: 15

    # Standard agent WebSocket (also available on mTLS port for migration)
    ws-agent:
      rule: "PathPrefix(`/ws/agent`) || PathPrefix(`/ws`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      middlewares:
        - agentRateLimit
      priority: 10

    # Agent API endpoints (certificate management, etc.)
    agent-api:
      rule: "PathPrefix(`/api/agent`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      middlewares:
        - agentRateLimit
      priority: 10

    # Health check endpoint
    agent-health:
      rule: "PathPrefix(`/health`)"
      entryPoints:
        - agents
      service: backend
      tls:
        options: mtls
      priority: 5

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://sentinel-backend:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://sentinel-frontend:80"

# TCP routers for TLS passthrough
tcp:
  routers:
    # gRPC Data Plane - TLS passthrough to backend
    grpc-dataplane:
      entryPoints:
        - grpc
      rule: "HostSNI(`*`)"
      service: grpc-backend
      tls:
        passthrough: true

  services:
    # gRPC backend - direct TCP connection
    grpc-backend:
      loadBalancer:
        servers:
          - address: "sentinel-backend:4444"
