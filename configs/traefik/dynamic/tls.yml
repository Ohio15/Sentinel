# Traefik Dynamic Configuration - TLS Options

tls:
  stores:
    internalCA:
      defaultCertificate:
        certFile: /certs/server-cert.pem
        keyFile: /certs/server-key.pem

  options:
    # Standard TLS for web clients — allow both h2 and http/1.1
    # Removed ALPN restriction to unblock agents with broken TLS stacks
    default:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      curvePreferences:
        - X25519
        - CurveP384
        - CurveP256
      sniStrict: false

    # Strict TLS 1.3 only option
    strict:
      minVersion: VersionTLS13
      sniStrict: true

    # Agent connections — accept client cert if given, but don't require it
    # This allows old agents with broken cert loading to still connect via token auth
    mtls:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      clientAuth:
        caFiles:
          - /certs/ca-cert.pem
        clientAuthType: VerifyClientCertIfGiven
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      curvePreferences:
        - X25519
        - CurveP384
        - CurveP256

    # gRPC TLS - verifies client cert if provided, but allows connections without
    grpc:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      clientAuth:
        caFiles:
          - /certs/ca-cert.pem
        clientAuthType: VerifyClientCertIfGiven
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      curvePreferences:
        - X25519
        - CurveP384
