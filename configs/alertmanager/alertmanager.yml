global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'ntfy-cortex-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'ntfy-cortex-alerts'
      group_wait: 10s
    - match:
        severity: warning
      receiver: 'ntfy-cortex-alerts'
      group_wait: 1m

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']

receivers:
  - name: 'ntfy-cortex-alerts'
    # Phase 3.5 LIVE: routes alerts through alertmanager-ntfy adapter ->
    # ntfy.nexus topic 'cortex-alerts'. Adapter handles auth (publisher
    # token) and Alertmanager -> ntfy payload translation.
    webhook_configs:
      - url: 'http://alertmanager-ntfy:8080/webhook'
        send_resolved: true
        max_alerts: 10
