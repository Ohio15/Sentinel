version: '3.8'

services:
  # Reverse Proxy - handles SSL, routing, mTLS for agents
  # NOTE: Using file-based config instead of Docker provider for Windows compatibility
  traefik:
    image: traefik:v3.0
    container_name: sentinel-traefik
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP (redirects to HTTPS)
      - "443:443"     # HTTPS for web clients
      - "4443:4443"   # Alternate HTTPS (bypasses router cache)
      - "8443:8443"   # mTLS for agent connections
      - "4444:4444"   # gRPC Data Plane
    volumes:
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - traefik-certs:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - sentinel-network
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinel-backend
    # Port 8090 for local development only - in production, only Traefik exposes ports
    ports:
      - "8090:8080"
    expose:
      - "4444"   # gRPC Data Plane (exposed via Traefik, not directly to host)
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-prefer}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
      - SERVER_ENV=${SERVER_ENV:-production}
      - ALLOWED_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - SERVER_URL=${SERVER_URL:-http://localhost:8090}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8090}
      - API_KEY=${API_KEY}
      # mTLS configuration
      - ENABLE_MTLS=${ENABLE_MTLS:-true}
      - CA_CERT_PATH=/certs/ca-cert.pem
      - CA_KEY_PATH=/certs/ca-key.pem
      - CERT_VALIDITY_YEARS=${CERT_VALIDITY_YEARS:-2}
      # gRPC Data Plane
      - GRPC_PORT=4444
      - TLS_CERT_PATH=/certs/server-cert.pem
      - TLS_KEY_PATH=/certs/server-key.pem
      # WebAuthn / Passkey Authentication
      - WEBAUTHN_RP_ID=${DOMAIN}
      - WEBAUTHN_RP_NAME=Sentinel RMM
      - WEBAUTHN_RP_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443,https://${DOMAIN}:8443
      - WEBAUTHN_TIMEOUT=60000
      - WEBAUTHN_USER_VERIFICATION=preferred
    volumes:
      - ./installers:/app/installers:ro
      - ./agent/version.json:/app/agent/version.json:ro
      - ./release/agent:/app/release/agent:ro
      - ./certs:/certs:ro
      - agent-certs:/app/agent-certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (built via CI/CD — image contains built assets from Dockerfile.web)
  # Deployment: push to master → CI passes → self-hosted runner rebuilds image
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_API_URL=https://${DOMAIN}/api
        - VITE_WS_URL=wss://${DOMAIN}/ws
    container_name: sentinel-frontend
    restart: unless-stopped
    volumes:
      - ./installers:/app/installers:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    # Port NOT exposed to host - only accessible within docker network
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-certs:
  traefik-logs:
  agent-certs:
