services:
  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinel-backend
    # Port 8090 for local development only - in production, only Traefik exposes ports
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:4445:4445"  # Plaintext gRPC for CF tunnel (localhost only)
      - "8443:8443"             # Agent mTLS HTTP (direct, no Traefik)
      - "4444:4444"             # Agent mTLS gRPC (direct, no Traefik)
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49252}:${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49252}/udp"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
      - SERVER_ENV=${SERVER_ENV:-production}
      - ALLOWED_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - SERVER_URL=${SERVER_URL:-http://localhost:8090}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8090}
      - API_KEY=${API_KEY}
      # mTLS configuration
      - ENABLE_MTLS=${ENABLE_MTLS:-true}
      - AGENT_MTLS_PORT=8443
      - CA_CERT_PATH=/certs/ca-cert.pem
      - CA_KEY_PATH=/certs/ca-key.pem
      - CERT_VALIDITY_YEARS=${CERT_VALIDITY_YEARS:-2}
      # gRPC Data Plane
      - GRPC_PORT=4444
      - GRPC_PLAINTEXT_PORT=4445
      - TLS_CERT_PATH=/certs/server-cert.pem
      - TLS_KEY_PATH=/certs/server-key.pem
      # WebAuthn / Passkey Authentication
      - WEBAUTHN_RP_ID=${DOMAIN}
      - WEBAUTHN_RP_NAME=Sentinel RMM
      - WEBAUTHN_RP_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443,https://${DOMAIN}:8443
      - WEBAUTHN_TIMEOUT=60000
      - WEBAUTHN_USER_VERIFICATION=preferred
      # TURN server for WebRTC relay
      - TURN_ENABLED=${TURN_ENABLED:-false}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP:-}
      - TURN_AUTH_SECRET=${TURN_AUTH_SECRET:-}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_MIN_PORT=${TURN_MIN_PORT:-49152}
      - TURN_MAX_PORT=${TURN_MAX_PORT:-49252}
    volumes:
      - ./installers:/app/installers:ro
      - ./agent/version.json:/app/agent/version.json:ro
      - ./release/agent:/app/release/agent:ro
      - ./certs:/certs:ro
      - agent-certs:/app/agent-certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-network
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (built via CI/CD — image contains built assets from Dockerfile.web)
  # Deployment: push to master → CI passes → self-hosted runner rebuilds image
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_API_URL=https://${DOMAIN}/api
        - VITE_WS_URL=wss://${DOMAIN}/ws
    container_name: sentinel-frontend
    restart: unless-stopped
    volumes:
      - ./installers:/app/installers:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel-network
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    # Port NOT exposed to host - only accessible within docker network
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/migrations:/docker-entrypoint-initdb.d:ro
      - ${PG_CERT_DIR:-./certs/postgres}/server-cert.pem:/var/lib/postgresql/server.crt:ro
      - ${PG_CERT_DIR:-./certs/postgres}/server-key.pem:/var/lib/postgresql/server.key:ro
      - ${PG_CERT_DIR:-./certs/postgres}/ca-cert.pem:/var/lib/postgresql/ca.crt:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c ssl_ca_file=/var/lib/postgresql/ca.crt
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redis-data:/data
    networks:
      - sentinel-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring - Prometheus metrics collection
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sentinel-network
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.prometheus-nexus.rule=Host(`prometheus.nexus`)
      - traefik.http.routers.prometheus-nexus.entrypoints=web,websecure
      - traefik.http.routers.prometheus-nexus.tls=true
      - traefik.http.services.prometheus-nexus.loadbalancer.server.port=9090
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Monitoring - Grafana dashboards
  grafana:
    image: grafana/grafana:11.0.0
    container_name: sentinel-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - sentinel-network
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.grafana-nexus.rule=Host(`grafana.nexus`)
      - traefik.http.routers.grafana-nexus.entrypoints=web,websecure
      - traefik.http.routers.grafana-nexus.tls=true
      - traefik.http.services.grafana-nexus.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

networks:
  sentinel-network:
    driver: bridge
  edge:
    external: true
    name: edge

volumes:
  postgres-data:
  redis-data:
  agent-certs:
  prometheus-data:
  grafana-data:
