# Production stack, deployed on NEXUS by the root-owned nexus-deploy helper
# (Ohio15/infra nexus-deploy/, stack spec stacks/sentinel.json) from a v* tag:
# images are built on GitHub-hosted runners by release.yml and pulled from
# ghcr by digest. The helper renders THIS file alone and checks it against the
# spec's allow-list, so it must stay free of `build:`, env_file, privileged,
# extra capabilities and anything the spec does not list. Every service drops
# ALL capabilities; none needs one back (backend and frontend run as their
# image users, postgres as 70:70, redis as 999:999, all owning their data).
# Local builds: `docker compose -f docker-compose.yml -f docker-compose.dev.yml`.
# Monitoring (prometheus, alertmanager, grafana, exporters) moved to the
# infra-owned monitoring stack (Ohio15/infra monitoring/); prometheus reaches
# the backend over the external `sentinel-metrics` network.
services:
  # Backend API Server
  backend:
    image: ghcr.io/ohio15/sentinel-backend:${IMAGE_TAG:-latest}
    container_name: sentinel-backend
    # Port 8090 for local development only - in production, only Traefik exposes ports
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:4445:4445"  # Plaintext gRPC for CF tunnel (localhost only)
      # Agent-facing ports are published on every IPv4 address. The host IP is
      # explicit because nexus-deploy matches it literally against the spec
      # (an omitted host IP renders as "" and is refused).
      - "0.0.0.0:8443:8443"     # Agent mTLS HTTP (direct, no Traefik)
      - "0.0.0.0:4444:4444"     # Agent mTLS gRPC (direct, no Traefik)
      - "0.0.0.0:${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "0.0.0.0:${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "0.0.0.0:${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49252}:${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49252}/udp"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-require}
      # No default: an unset REDIS_PASSWORD must fail compose closed rather than
      # silently starting the stack on a publicly-known password.
      # KNOWN RESIDUAL EXPOSURE: this value lands in sentinel-backend's
      # Config.Env, readable by any holder of the Docker socket (currently
      # shared-brain-docker-proxy, infra-traefik, sentinel-cadvisor,
      # sentinel-node-exporter). Closing it requires the backend to read the
      # secret from a file (REDIS_PASSWORD_FILE) instead of a URL in env.
      # Tracked separately — do not assume this line is safe.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (64 hex chars); run scripts/rotate-redis-password.sh to generate one}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
      - SERVER_ENV=${SERVER_ENV:-production}
      - ALLOWED_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - SERVER_URL=${SERVER_URL:-http://localhost:8090}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8090}
      - API_KEY=${API_KEY}
      # mTLS configuration
      - ENABLE_MTLS=${ENABLE_MTLS:-true}
      - AGENT_MTLS_PORT=8443
      - CA_CERT_PATH=/certs/ca-cert.pem
      - CA_KEY_PATH=/certs/ca-key.pem
      - CERT_VALIDITY_YEARS=${CERT_VALIDITY_YEARS:-2}
      # gRPC Data Plane
      - GRPC_PORT=4444
      - GRPC_PLAINTEXT_PORT=4445
      - TLS_CERT_PATH=/certs/server-cert.pem
      - TLS_KEY_PATH=/certs/server-key.pem
      # WebAuthn / Passkey Authentication
      - WEBAUTHN_RP_ID=${DOMAIN}
      - WEBAUTHN_RP_NAME=Sentinel RMM
      - WEBAUTHN_RP_ORIGINS=https://${DOMAIN},https://${DOMAIN}:4443,https://${DOMAIN}:8443
      - WEBAUTHN_TIMEOUT=60000
      - WEBAUTHN_USER_VERIFICATION=preferred
      # TURN server for WebRTC relay
      - TURN_ENABLED=${TURN_ENABLED:-false}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP:-}
      - TURN_AUTH_SECRET=${TURN_AUTH_SECRET:-}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_MIN_PORT=${TURN_MIN_PORT:-49152}
      - TURN_MAX_PORT=${TURN_MAX_PORT:-49252}
    volumes:
      # INSTALLERS_DIR: the signed-release serving directory. On NEXUS it is
      # /home/ohio_/Sentinel/installers (set in the nexus-deploy env file),
      # which deploy-installers.yml fills; the spec pins that exact path.
      - ${INSTALLERS_DIR:-./installers}:/app/installers:ro
      # agent/version.json is deliberately NOT mounted: the server reads
      # installers/version.json first, and the tracked file in a deploy tree
      # nobody updates any more could only ever be a stale fallback.
      # release/agent is deliberately NOT mounted. It is a canonical artifact
      # search root (installer_paths.go), and findPlatformBinary falls back to
      # the unsuffixed "sentinel-<kind>" name — so the stale, unsigned,
      # linux-amd64 release/agent/sentinel-agent tracked in git was being served
      # as the agent binary for linux-arm64, darwin-amd64 and darwin-arm64.
      # Under signed updates (RW-1) that is worse than serving nothing: those
      # agents are told the new version is available, download wrong-arch
      # unsigned bytes, and fail closed permanently. With the mount gone the
      # lookup misses and the server correctly answers available:false.
      # Everything the server actually reads from here exists in ./installers
      # (sentinel-installer-template.exe, version.json — verified identical by
      # sha256); latest.yml/agent-latest.yml are legacy electron-updater files
      # no server code reads.
      # On NEXUS the helper maps ./certs to /srv/nexus-state/sentinel/certs
      # (root-owned dir; the keys stay owned by uid 1001 = appuser, 0440, so
      # the backend reads them as their owner with every capability dropped).
      - ./certs:/certs:ro
      - agent-certs:/app/agent-certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - edge
      # Prometheus scrape link (infra monitoring stack), backend + prometheus only.
      - sentinel-metrics
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend. Built on a GitHub-hosted runner by release.yml (the VITE_* URLs
  # are baked at build time from release-config.yml); nginx.conf is baked into
  # the image by Dockerfile.web, so it is not bind-mounted.
  frontend:
    image: ghcr.io/ohio15/sentinel-frontend:${IMAGE_TAG:-latest}
    container_name: sentinel-frontend
    restart: unless-stopped
    volumes:
      - ${INSTALLERS_DIR:-./installers}:/app/installers:ro
    networks:
      - default
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    # Runs as the image's postgres uid with no capabilities: the data dir and
    # the bound server key are 70:70 (0700 / 0600) on NEXUS. Started as root
    # with ALL dropped, the entrypoint could not traverse the 0700 data dir.
    user: "70:70"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    # Port NOT exposed to host - only accessible within docker network
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # NOTE: schema is owned by the backend's golang-migrate runner
      # (server/pkg/database/migrations, applied on boot). The old
      # ./src/main/migrations initdb mount was empty and misleading — removed.
      - ${PG_CERT_DIR:-./certs/postgres}/server-cert.pem:/var/lib/postgresql/server.crt:ro
      - ${PG_CERT_DIR:-./certs/postgres}/server-key.pem:/var/lib/postgresql/server.key:ro
      - ${PG_CERT_DIR:-./certs/postgres}/ca-cert.pem:/var/lib/postgresql/ca.crt:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c ssl_ca_file=/var/lib/postgresql/ca.crt
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    # The image's redis uid; /data is 999-owned. The bound redis.conf must be
    # readable by 999 (on NEXUS: /srv/nexus-state/sentinel/redis/redis.conf,
    # 999:999 0400; see Ohio15/infra nexus-deploy/README.md Sentinel runbook).
    user: "999:999"
    restart: unless-stopped
    # requirepass deliberately does NOT appear on the argv. Anything on the argv
    # is recorded verbatim in the container's Config.Cmd, which every holder of
    # the Docker socket can read. The password now lives only in a generated,
    # non-world-readable config file — see scripts/generate-redis-conf.sh.
    # The conf file is NOT in git (configs/redis/redis.conf is gitignored); it is
    # produced on the host from .env at deploy time. If it is missing, Docker
    # would create a directory at the mount path and redis would fail to start,
    # so run the generator before `docker compose up`.
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ${REDIS_CONF_DIR:-./configs/redis}/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # The healthcheck argv is what Docker publishes in the event stream, once per
    # `interval`, forever, to every consumer of `docker events` (infra-traefik
    # consumes it continuously). The previous ["CMD","redis-cli","-a","<pw>",...]
    # form therefore broadcast the password roughly every 10 seconds.
    #
    # CMD-SHELL keeps the recorded argv a literal, unexpanded string: the event
    # stream shows the `$(sed ...)` text, never its value. The secret is read at
    # runtime inside the container from the same root-owned conf file redis
    # itself reads, and passed via REDISCLI_AUTH (process environ) rather than
    # `-a` (process argv), so it does not appear in the container's own `ps`
    # either. It is deliberately NOT put in the service `environment:` block,
    # which would restore the Config.Env exposure this change exists to remove.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf)"
          redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # The project's own network is compose's implicit `default` (sentinel_default):
  # nexus-deploy allows only `default` plus spec-listed external networks.
  edge:
    external: true
    name: edge
  # Created once on NEXUS by the infra monitoring stack rollout (internal: no
  # gateway; members: sentinel-backend and the infra prometheus only).
  sentinel-metrics:
    external: true
    name: sentinel-metrics

volumes:
  postgres-data:
  redis-data:
  agent-certs:
