name: Deploy Shared Brain MCP

on:
  workflow_dispatch:
    inputs:
      fix_ssh:
        description: 'Restart SSH service'
        required: false
        default: 'true'
        type: boolean
      deploy_mcp:
        description: 'Deploy the shared-brain-mcp server'
        required: false
        default: 'true'
        type: boolean

jobs:
  deploy:
    name: Deploy Shared Brain MCP Server
    runs-on: self-hosted

    steps:
      - name: Fix SSH service
        if: ${{ inputs.fix_ssh }}
        run: |
          echo "=== Checking SSH status ==="
          sudo systemctl status sshd 2>&1 || sudo systemctl status ssh 2>&1 || echo "SSH service not found"
          echo "=== Restarting SSH ==="
          sudo systemctl restart sshd 2>&1 || sudo systemctl restart ssh 2>&1 || sudo service ssh restart 2>&1 || echo "Could not restart SSH"
          echo "=== Verifying SSH ==="
          sleep 2
          ss -tlnp | grep :22 || netstat -tlnp 2>/dev/null | grep :22 || echo "Port 22 not listening"

      - name: Checkout source
        if: ${{ inputs.deploy_mcp }}
        uses: actions/checkout@v4

      - name: Setup MCP directories
        if: ${{ inputs.deploy_mcp }}
        run: |
          mkdir -p ~/shared-brain-mcp/lib
          mkdir -p ~/.claude/memory/state

      - name: Deploy MCP source from repo
        if: ${{ inputs.deploy_mcp }}
        run: |
          # Copy files from the shared-brain-mcp directory in the repo
          if [ -d "shared-brain-mcp" ]; then
            cp -r shared-brain-mcp/* ~/shared-brain-mcp/
          else
            echo "No shared-brain-mcp directory in repo - files must be transferred via SSH"
            echo "Run: deploy-remote.sh from your local machine"
          fi

      - name: Create .env for Linux paths
        if: ${{ inputs.deploy_mcp }}
        run: |
          cat > ~/shared-brain-mcp/.env << 'EOF'
          BRAIN_VOLUME=/home/ohio_/.claude/memory/procedural
          STATE_VOLUME=/home/ohio_/.claude/memory/state
          EOF

      - name: Build and start Docker container
        if: ${{ inputs.deploy_mcp }}
        run: |
          cd ~/shared-brain-mcp
          if [ -f "docker-compose.yml" ] && [ -f "Dockerfile" ]; then
            docker compose up -d --build
            sleep 3
            curl -s http://localhost:3100/health || echo "Health check failed"
          else
            echo "Docker files not found - deploy via SSH first"
          fi

      - name: Verify environment
        run: |
          echo "=== System info ==="
          uname -a
          echo "=== Docker status ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}' 2>/dev/null || echo "Docker not available"
          echo "=== Brain files ==="
          ls -la ~/.claude/memory/procedural/ 2>/dev/null | head -15
          echo "=== SSH port ==="
          ss -tlnp | grep :22 || echo "Port 22 not listening"
          echo "=== MCP health ==="
          curl -s http://localhost:3100/health 2>/dev/null || echo "MCP not running"
