name: Deploy Web Frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Pull latest code
        run: cd ~/Sentinel && git pull origin master

      - name: Rebuild and deploy frontend
        run: cd ~/Sentinel && docker compose build frontend && docker compose up -d frontend

      - name: Verify deployment
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            if docker exec sentinel-frontend wget -q --spider http://localhost/health 2>/dev/null; then
              echo "Frontend is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not ready yet..."
          done
          echo "FAILED: Frontend did not become healthy after 25 seconds"
          docker logs sentinel-frontend --tail 20
          exit 1
