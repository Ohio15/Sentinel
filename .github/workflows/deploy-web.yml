name: Deploy Web Frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Pull latest code
        run: cd ~/Sentinel && git pull origin master

      - name: Rebuild and deploy frontend
        run: cd ~/Sentinel && docker compose build frontend && docker compose up -d frontend

      - name: Verify deployment
        run: |
          sleep 3
          if docker exec sentinel-frontend wget -q --spider http://localhost/health; then
            echo "Frontend is healthy"
          else
            echo "WARNING: Frontend health check failed"
            docker logs sentinel-frontend --tail 20
            exit 1
          fi
