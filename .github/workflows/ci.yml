name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Security Scanning (runs in parallel with build jobs)
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Go vulnerability check
        # Agent is Windows-targeted (uses x/sys/windows, protection_windows.go,
        # syscall.NewLazyDLL, etc.); scan against the actual production GOOS.
        # CGO is disabled because govulncheck only needs to load packages for
        # vulnerability analysis — no native libs (X11, PulseAudio) required.
        working-directory: ./agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: npm audit
        run: npm audit --audit-level=high || true

  # Go Agent - Build and Test
  agent:
    name: Agent Build & Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...
        continue-on-error: true  # Windows syscall code uses unsafe.Pointer patterns that trigger vet warnings

      - name: Run tests
        run: go test -race -timeout 60s ./...

      - name: Build agent
        run: go build -o sentinel-agent.exe ./cmd/sentinel-agent

      - name: Build watchdog
        run: go build -o sentinel-watchdog.exe ./cmd/sentinel-watchdog

      - name: Check for Go vulnerabilities
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true
        continue-on-error: true  # Advisory only

  # Web Frontend - Build and Lint
  app:
    name: Web App Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build web frontend
        run: npm run build:web

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high --production
        continue-on-error: true  # Advisory only, don't block on transitive deps

  # Integration Tests (runs after build jobs succeed)
  integration-tests:
    name: Integration Tests
    runs-on: self-hosted
    needs: [agent, app]
    steps:
      - uses: actions/checkout@v4

      - name: Start test environment
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          sleep 15  # Wait for services to be ready

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8091/health > /dev/null 2>&1; then
              echo "Backend healthy on attempt $i"
              break
            fi
            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done

      - name: Run validation script
        run: ./scripts/validate-critical-paths.sh http://localhost:8091

      - name: Tear down test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Cross-platform agent builds (on release tags)
  agent-release:
    name: Agent Release Builds
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agent, app]
    defaults:
      run:
        working-directory: agent

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o sentinel-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/sentinel-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/sentinel-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
