# dev-standards release contract — see https://github.com/Ohio15/dev-standards/blob/main/release/SPEC.md
#
# Tag-driven (v*) image release. Both images are built on GitHub-hosted
# runners (release.yml pins runs_on: ubuntu-latest) and pushed to ghcr. The
# deploy is nexus-deploy helper mode (release.yml `nexus_deploy_stack:
# sentinel`): the helper owns the source tree, the compose policy, health
# (GET /health `.version` must equal the tag) and rollback, so this file has
# no docker.deploy block. The old push-to-main deploy-web.yml path (git reset
# and docker compose build on NEXUS) is retired.

surface: docker
project: sentinel

gates:
  # Existing ci.yml already runs the comprehensive Go + npm test suite on
  # every push. Tag-time gates focus on belt-and-suspenders checks.
  tests: false
  gitleaks: true
  size_guard: true
  npm_audit: critical
  conventional_commits: false

docker:
  images:
    - name: ghcr.io/ohio15/sentinel-backend
      dockerfile: server/Dockerfile
      context: ./server
    - name: ghcr.io/ohio15/sentinel-frontend
      dockerfile: Dockerfile.web
      context: .
      # Baked into the bundle at Vite build time; the same values the NEXUS
      # build used from .env DOMAIN. sentinelrmm.us is the public product
      # domain, not a secret.
      build_args:
        VITE_API_URL: https://sentinelrmm.us/api
        VITE_WS_URL: wss://sentinelrmm.us/ws
